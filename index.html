<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام نقاط الخدام</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#161c2d;--mut:#667085;--nav:#12193a;--navtx:#c9d0e6;--pri:#7a1f2b;--gold:#c9962c;--bd:#e2e6ee;--ok:#1a7f4e;--danger:#c0392b;--sh:0 1px 2px rgba(18,25,58,.06),0 6px 18px rgba(18,25,58,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1220;--card:#171d33;--tx:#eef1fa;--mut:#9aa4c0;--nav:#0a0e1c;--pri:#e0707f;--gold:#e0b04a;--bd:#2a3250;--ok:#4cc38a;--danger:#f07b72;--sh:none}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--nav);color:var(--navtx);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff;font-weight:800;font-size:18px}
.logo{object-fit:contain;display:block}.brand .logo{width:52px;height:52px;flex:none}.brand{font-size:16px;line-height:1.3}
aside button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:right;margin-bottom:2px}
aside button:hover{background:rgba(255,255,255,.07)}aside button.on{background:#fff;color:#12193a;font-weight:600}
.me{margin-top:18px;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}.me b{display:block;color:#fff}
section.main{padding:22px clamp(14px,3vw,32px) 40px;max-width:1100px;width:100%}
h2{font-size:22px;margin:0 0 16px;font-weight:800}h3{font-size:16px;margin:0 0 12px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid .card{margin:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kpi span{color:var(--mut);font-size:13px}.kpi b{display:block;font-size:26px;font-weight:800;line-height:1.3}.kpi small{color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);min-width:140px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.b{background:var(--pri);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);padding:3px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
button.d{color:var(--danger)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mut);font-size:13px;font-weight:600}tbody tr:hover{background:var(--bg)}
.pts{font-weight:800;color:var(--ok)}.mut{color:var(--mut)}.link{cursor:pointer;color:var(--pri);font-weight:600}
.medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--bd);font-size:13px;font-weight:800}
.m1{background:var(--gold);color:#12193a}.m2{background:#b8c0cc;color:#12193a}.m3{background:#c98a5a;color:#fff}
.hr{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin:9px 0}.hr .hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr[onclick]{cursor:pointer}.ht{background:var(--bg);border-radius:8px;height:12px;overflow:hidden}.hf{height:100%;border-radius:8px}.hr b{text-align:left}
.bars{display:flex;gap:6px;height:170px;align-items:stretch}.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}.bb{width:68%;max-width:34px;background:var(--pri);border-radius:7px 7px 0 0;min-height:2px}
.bv{font-size:12px;font-weight:600;height:18px}.bl{font-size:11px;color:var(--mut)}
.hero{background:linear-gradient(135deg,#12193a,#7a1f2b);color:#fff;border-radius:16px;padding:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.hero .big{font-size:60px;font-weight:800;line-height:1;color:var(--gold)}.hero .nm{font-size:24px;font-weight:800}.hero p{margin:2px 0;opacity:.85}
.hero .rk{margin-inline-start:auto;text-align:center;background:rgba(255,255,255,.12);padding:12px 20px;border-radius:14px}.hero .rk b{font-size:28px;display:block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.best{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}.best:last-child{border:0}
.perm{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 0 12px}.perm label{flex-direction:row;align-items:center;color:var(--tx);font-size:14px}.perm input{min-width:0}
#login{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#12193a,#7a1f2b)}
#login .card{width:100%;max-width:360px;padding:26px}#login input{width:100%;margin-bottom:12px}#login h2{margin-bottom:4px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding:10px;display:flex;gap:4px;overflow-x:auto;align-items:center}
.brand,.me{display:none}aside button{width:auto;white-space:nowrap;flex:none;padding:8px 12px}.hero .big{font-size:46px}.hr{grid-template-columns:90px 1fr 40px}
.topbar{display:flex!important}}
.topbar{display:none;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--nav);color:#fff;font-weight:800}
.topbar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:4px 12px;font:inherit}
@media(prefers-reduced-motion:no-preference){.bb,.hf{transition:height .4s,width .4s}}
</style></head><body>

{id:'fin',t:'المالية',p:2,i:'💰'},{id:'users',t:'المستخدمين',i:'🔐'}];
const CATS=['att','dawa','prep','deco','mass','visit','fin'],COLS=['servants',...CATS,'users'];
const CN=Object.fromEntries(SC.map(s=>[s.id,s.t]));
const CC={att:'#7a1f2b',dawa:'#c9962c',prep:'#2f6f9f',deco:'#8a4fa0',mass:'#1a7f4e',visit:'#d0702a',fin:'#64748b'};

const D={};COLS.forEach(c=>D[c]=[]);

const today=()=>new Date().toISOString().slice(0,10),uid=()=>Math.random().toString(36).slice(2,10);

// ---- storage (Google Sheets via Apps Script) — unchanged data format
async function load(){
  if(document.hidden)return;
  try{
    const r=await(await fetch(API)).json(),j=JSON.stringify(r);
    if(j===last)return;
    if(last&&/INPUT|SELECT/.test(document.activeElement.tagName))return;
    last=j;COLS.forEach(c=>D[c]=r[c]||[]);ready=1;
    if(!D.users.length)seedAdmin();else render();
  }catch(e){}
}
async function save(c,o){
  if(!o.id)o.id=uid();
  const i=D[c].findIndex(x=>x.id===o.id);i<0?D[c].push(o):D[c][i]=o;
  last='';setTimeout(render,0);
  try{await fetch(API,{method:'POST',body:JSON.stringify({action:'set',col:c,doc:o})})}catch(e){alert('تعذر الحفظ')}
}
async function del(c,id){
  if(!confirm('تأكيد الحذف؟'))return;
  D[c]=D[c].filter(x=>x.id!==id);last='';render();
  try{await fetch(API,{method:'POST',body:JSON.stringify({action:'del',col:c,id})})}catch(e){alert('تعذر الحذف')}
}
function init(){document.querySelector('link[rel=icon]').href=LOGO;render();load();setInterval(load,15000)}
function seedAdmin(){if(!D.users.length)save('users',{id:'admin',name:'المدير',username:'admin',password:'admin',perms:SC.map(s=>s.id)})}

// ---- calculations
const sName=id=>(D.servants.find(s=>s.id===id)||{}).name||'(محذوف)';
const can=id=>me&&(me.id==='admin'||(me.perms||[]).includes(id));
const sum=(c,id)=>D[c].filter(r=>r.sid===id).reduce((a,r)=>a+(+r.pts||0),0);
const total=id=>CATS.reduce((t,c)=>t+sum(c,id),0);
const ranking=()=>D.servants.map(s=>({s,t:total(s.id)})).sort((a,b)=>b.t-a.t||a.s.name.localeCompare(b.s.name,'ar'));
const mon=d=>{const x=new Date((d||today())+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-(x.getUTCDay()+6)%7);return x.toISOString().slice(0,10)};
function trend(sid){
  const w=[];let m=new Date(mon()+'T00:00:00Z');
  for(let i=0;i<8;i++){w.unshift(m.toISOString().slice(0,10));m=new Date(m.getTime()-7*864e5)}
  const v=w.map(()=>0);
  CATS.forEach(c=>D[c].forEach(r=>{if(sid&&r.sid!==sid)return;const i=w.indexOf(mon(r.date));if(i>=0)v[i]+=+r.pts||0}));
  return{w,v};
}
const bars=t=>{const m=Math.max(...t.v,1);return `<div class="bars">${t.v.map((x,i)=>`<div class="bc"><span class="bv">${x||''}</span><div class="bw"><div class="bb" style="height:${x/m*100}%"></div></div><span class="bl">${t.w[i].slice(5)}</span></div>`).join('')}</div>`};
const hrow=(n,v,max,col,ck)=>`<div class="hr" ${ck?`onclick="${ck}"`:''}><span class="hn">${esc(n)}</span><div class="ht"><div class="hf" style="width:${max?v/max*100:0}%;background:${col}"></div></div><b>${v}</b></div>`;
const medal=i=>`<span class="medal ${i<3?'m'+(i+1):''}">${i+1}</span>`;
const sOpts=sel=>D.servants.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
const go=id=>{if(can('profile')){pid=id;cur='profile';edit=null;render();scrollTo(0,0)}};

// ---- shell
function render(){
  const A=$('#app');
  if(!me){
    A.innerHTML=`<div id="login"><div class="card" style="text-align:center"><img class="logo" src="${LOGO}" alt="" style="width:120px;height:120px;margin:0 auto 10px"><h2>نظام نقاط الخدام</h2><p class="mut">سجّل الدخول للمتابعة</p>
    <input id="lu" placeholder="اسم المستخدم" autocomplete="username"><input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="b" style="width:100%" onclick="login()">دخول</button><p id="le" style="color:var(--danger);margin:10px 0 0"></p></div></div>`;
    return}
  me=D.users.find(u=>u.id===me.id)||me;
  const vis=SC.filter(s=>can(s.id));
  if(!cur||!can(cur))cur=vis[0]&&vis[0].id;
  A.innerHTML=`<div class="topbar"><span style="display:flex;align-items:center;gap:8px"><img class="logo" src="${LOGO}" alt="" style="width:34px;height:34px">نظام نقاط الخدام</span><button onclick="me=null;render()">خروج</button></div>
  <div class="shell"><aside><div class="brand"><img class="logo" src="${LOGO}" alt="">نظام نقاط الخدام</div>
  ${vis.map(s=>`<button class="${s.id===cur?'on':''}" onclick="cur='${s.id}';edit=null;render()"><span>${s.i}</span>${s.t}</button>`).join('')}
  <div class="me"><b>${esc(me.name)}</b><button onclick="me=null;render()" style="padding:6px 0">تسجيل الخروج</button></div></aside>
  <section class="main">${cur?`<h2>${CN[cur]}</h2>`+view(cur):'<div class="card">لا توجد شاشات متاحة لهذا المستخدم. اطلب من المدير إضافة صلاحيات.</div>'}</section></div>`;
}
function login(){
  const u=D.users.find(x=>x.username===$('#lu').value.trim()&&x.password===$('#lp').value);
  if(!u){$('#le').textContent=ready?'اسم المستخدم أو كلمة المرور غير صحيحة':'جارٍ تحميل البيانات... حاول مرة أخرى بعد لحظات';return}
  me=u;cur=null;render();
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#login'))login()});
document.addEventListener('change',e=>{if(e.target.id==='g3')$('#g4').value=DAYS[e.target.value];if(e.target.id==='pp'){pid=e.target.value;render()}});
function view(id){return{dash:dashV,profile:profileV,servants:servantsV,points:pointsV,users:usersV}[id]?.()||logV(SC.find(s=>s.id===id))}

// ---- dashboards
function dashV(){
  const R=ranking(),T=R.reduce((a,r)=>a+r.t,0),mk=today().slice(0,7);
  const mc=CATS.reduce((n,c)=>n+D[c].filter(r=>(r.date||'').startsWith(mk)).length,0);
  const ct=CATS.map(c=>({c,v:D[c].reduce((a,r)=>a+(+r.pts||0),0)})),cm=Math.max(...ct.map(x=>x.v),1),tm=R[0]?R[0].t:0;
  const bests=CATS.map(c=>{let b=null;D.servants.forEach(s=>{const v=sum(c,s.id);if(v>0&&(!b||v>b.v))b={s,v}});return{c,b}});
  return `<div class="kpis">
  <div class="kpi"><span>عدد الخدام</span><b>${D.servants.length}</b></div>
  <div class="kpi"><span>إجمالي النقاط</span><b>${T}</b></div>
  <div class="kpi"><span>الأول حالياً</span><b style="font-size:20px">${R[0]&&R[0].t?esc(R[0].s.name):'—'}</b><small>${R[0]&&R[0].t?R[0].t+' نقطة':''}</small></div>
  <div class="kpi"><span>حركات هذا الشهر</span><b>${mc}</b></div></div>
  <div class="grid"><div class="card"><h3>أعلى 5 خدام</h3>${R.slice(0,5).map((r,i)=>hrow((i+1)+'. '+r.s.name,r.t,tm,'var(--gold)',`go('${r.s.id}')`)).join('')||'<p class="mut">أضف خدام وسجّل أول حركة.</p>'}</div>
  <div class="card"><h3>النقاط حسب النشاط</h3>${ct.map(x=>hrow(CN[x.c],x.v,cm,CC[x.c])).join('')}</div></div>
  <div class="grid" style="margin-top:16px"><div class="card"><h3>نقاط آخر 8 أسابيع</h3>${bars(trend())}</div>
  <div class="card"><h3>الأفضل في كل نشاط</h3>${bests.map(x=>`<div class="best"><span><i class="dot" style="background:${CC[x.c]}"></i>${CN[x.c]}</span><b>${x.b?`<span class="${can('profile')?'link':''}" onclick="go('${x.b.s.id}')">${esc(x.b.s.name)}</span> <span class="mut">(${x.b.v})</span>`:'—'}</b></div>`).join('')}</div></div>`;
}
function profileV(){
  if(!D.servants.length)return '<div class="card">أضف خدام أولاً من شاشة بيانات الخدام.</div>';
  const R=ranking();if(!D.servants.some(s=>s.id===pid))pid=R[0].s.id;
  const i=R.findIndex(r=>r.s.id===pid),me_=R[i],tm=R[0].t,t=me_.t;
  const rows=CATS.flatMap(c=>D[c].filter(r=>r.sid===pid).map(r=>({...r,c}))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
  const cm=Math.max(...CATS.map(c=>sum(c,pid)),1);
  return `<div class="row"><label>اختر الخادم<select id="pp">${sOpts(pid)}</select></label></div>
  <div class="hero"><div><div class="nm">${esc(me_.s.name)}</div><p>${me_.s.sex}</p><div class="big">${t}</div><p>إجمالي النقاط${tm?` — ${Math.round(t/tm*100)}% من نقاط الأول`:''}</p></div>
  <div class="rk"><b>#${i+1}</b>من ${R.length} خادم</div></div>
  <div class="grid"><div class="card"><h3>النقاط حسب النشاط</h3>${CATS.map(c=>hrow(CN[c],sum(c,pid),cm,CC[c])).join('')}</div>
  <div class="card"><h3>نقاطه آخر 8 أسابيع</h3>${bars(trend(pid))}</div></div>
  <div class="card tw" style="margin-top:16px"><h3>آخر الحركات</h3><table><tr><th>التاريخ</th><th>النشاط</th><th>النقاط</th></tr>
  ${rows.map(r=>`<tr><td>${r.date}</td><td><i class="dot" style="background:${CC[r.c]}"></i>${CN[r.c]}${r.day?' ('+r.day+')':''}</td><td class="pts">${r.pts}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">لا توجد حركات بعد</td></tr>'}</table></div>`;
}
function pointsV(){
  const R=ranking(),tm=R[0]?R[0].t:0;
  return `<div class="card tw"><table><tr><th>الترتيب</th><th>اسم الخادم</th><th>إجمالي النقاط</th><th style="width:30%"></th></tr>
  ${R.map((r,i)=>`<tr><td>${medal(i)}</td><td><span class="${can('profile')?'link':''}" onclick="go('${r.s.id}')">${esc(r.s.name)}</span></td><td class="pts">${r.t}</td>
  <td><div class="ht"><div class="hf" style="width:${tm?r.t/tm*100:0}%;background:var(--gold)"></div></div></td></tr>`).join('')||'<tr><td colspan=4 class="mut">لا يوجد خدام بعد</td></tr>'}</table></div>`;
}

// ---- data screens
function servantsV(){
  const e=edit&&D.servants.find(s=>s.id===edit)||{};
  return `<div class="card"><div class="row"><label>الاسم<input id="f1" value="${esc(e.name)}"></label>
  <label>الجنس<select id="f2"><option ${e.sex==='ذكر'?'selected':''}>ذكر</option><option ${e.sex==='أنثى'?'selected':''}>أنثى</option></select></label>
  <button class="b" onclick="saveServant()">${edit?'حفظ التعديل':'إضافة خادم'}</button>${edit?'<button class="s" onclick="edit=null;render()">إلغاء</button>':''}</div>
  <div class="tw"><table><tr><th>الاسم</th><th>الجنس</th><th></th></tr>${D.servants.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.sex}</td>
  <td><button class="s" onclick="edit='${s.id}';render()">تعديل</button> <button class="s d" onclick="del('servants','${s.id}')">حذف</button></td></tr>`).join('')}</table></div></div>`;
}
function saveServant(){const n=$('#f1').value.trim();if(!n)return;save('servants',{id:edit||undefined,name:n,sex:$('#f2').value});edit=null}
function logV(s){
  const c=s.id,isAtt=c==='att',e=edit&&D[c].find(r=>r.id===edit)||{};
  const rows=[...D[c]].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<div class="card"><div class="row"><label>التاريخ<input type="date" id="g1" value="${e.date||today()}"></label>
  <label>اسم الخادم<select id="g2">${sOpts(e.sid)}</select></label>
  ${isAtt?`<label>اليوم<select id="g3">${Object.keys(DAYS).map(d=>`<option ${e.day===d?'selected':''}>${d}</option>`).join('')}</select></label>`:''}
  <label>${isAtt?'النقاط':'الدرجة'}<input id="g4" type="number" value="${e.pts??(isAtt?2:s.p)}" ${isAtt?'readonly':''} style="min-width:80px;width:90px"></label>
  <button class="b" onclick="saveLog('${c}')">${edit?'حفظ التعديل':'إضافة'}</button>${edit?'<button class="s" onclick="edit=null;render()">إلغاء</button>':''}</div>
  <div class="tw"><table><tr><th>التاريخ</th><th>اسم الخادم</th>${isAtt?'<th>اليوم</th>':''}<th>${isAtt?'النقاط':'الدرجة'}</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${r.date}</td><td>${esc(sName(r.sid))}</td>${isAtt?`<td>${r.day}</td>`:''}<td class="pts">${r.pts}</td>
  <td><button class="s" onclick="edit='${r.id}';render()">تعديل</button> <button class="s d" onclick="del('${c}','${r.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=5 class="mut">لا توجد حركات بعد</td></tr>'}</table></div></div>`;
}
function saveLog(c){
  const sid=$('#g2').value;if(!sid){alert('أضف خادمًا أولاً');return}
  const o={id:edit||undefined,date:$('#g1').value,sid,pts:c==='att'?DAYS[$('#g3').value]:+$('#g4').value};
  if(c==='att')o.day=$('#g3').value;save(c,o);edit=null;
}
function usersV(){
  const e=edit&&D.users.find(u=>u.id===edit)||{perms:[]};
  return `<div class="card"><div class="row"><label>الاسم<input id="u1" value="${esc(e.name)}"></label>
  <label>اسم المستخدم<input id="u2" value="${esc(e.username)}"></label><label>كلمة المرور<input id="u3" value="${esc(e.password)}"></label></div>
  <div class="mut">الشاشات المسموح بها:</div><div class="perm">${SC.map(s=>`<label><input type="checkbox" class="pc" value="${s.id}" ${(e.perms||[]).includes(s.id)?'checked':''}> ${s.t}</label>`).join('')}</div>
  <button class="b" onclick="saveUser()">${edit?'حفظ التعديل':'إضافة مستخدم'}</button>${edit?' <button class="s" onclick="edit=null;render()">إلغاء</button>':''}</div>
  <div class="card tw"><table><tr><th>الاسم</th><th>المستخدم</th><th>الشاشات</th><th></th></tr>${D.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td>
  <td style="white-space:normal">${u.id==='admin'?'كل الشاشات':(u.perms||[]).map(p=>CN[p]).join('، ')}</td>
  <td><button class="s" onclick="edit='${u.id}';render()">تعديل</button> ${u.id===me.id?'':`<button class="s d" onclick="del('users','${u.id}')">حذف</button>`}</td></tr>`).join('')}</table></div>`;
}
function saveUser(){
  const n=$('#u1').value.trim(),un=$('#u2').value.trim(),pw=$('#u3').value;
  if(!n||!un||!pw){alert('أكمل كل البيانات');return}
  if(D.users.some(u=>u.username===un&&u.id!==edit)){alert('اسم المستخدم مستخدم من قبل');return}
  save('users',{id:edit||undefined,name:n,username:un,password:pw,perms:[...document.querySelectorAll('.pc:checked')].map(x=>x.value)});edit=null;
}
init();
</script></body></html>
